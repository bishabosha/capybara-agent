mill-build:
  bspScriptIgnore:
    - skills/
    - builtin-skills/
    - .metals/
extends: ScalaModule
scalaVersion: 3.10.0
repositories: ["https://repo.scala-lang.org/artifactory/maven-nightlies"]
scalacOptions:
  - -Wunused:imports
  - -preview
  - -Wnonunit-statement
mvnDeps:
  - com.lihaoyi::mainargs:0.7.8
  - com.softwaremill.sttp.client4::core:4.0.26
  - com.softwaremill.sttp.ai::openai:0.11.4
  - com.lihaoyi::upickle-implicits-named-tuples:4.4.3
  - com.lihaoyi::upickle-jsonschema:4.4.3
  - org.jline:jline:3.30.0
  - ch.epfl.lamp::steps:0.2.1
  - org.scala-lang::scala3-repl:3.10.0
  - com.lihaoyi::os-lib:0.11.8
  - io.github.bishabosha::scala-object-notation:0.2.2-RC1
  - org.virtuslab::scala-yaml:0.3.1
